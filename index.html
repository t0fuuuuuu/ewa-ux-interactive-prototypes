<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive EastWest Ageas Fund Switch self-service prototype" />
    <title>Fund Switch — EastWest Ageas</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2841-93096-fit" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0;20..48,400,1,0&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,400,1,0&family=Montserrat:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="main-nav">
      <button class="brand" type="button" data-action="restart" aria-label="Return to Services">
        <img src="assets/figma-main-nav-logo.svg" alt="eastwest ageas insurance" />
      </button>
      <nav aria-label="Primary navigation">
        <button type="button" data-nav="Dashboard">Dashboard</button>
        <button type="button" data-nav="Policy Details">Policy Details</button>
        <button type="button" data-nav="Documents">Documents</button>
        <button type="button" data-nav="Payments">Payments</button>
        <button class="active" type="button" data-action="restart" aria-current="page">Services</button>
      </nav>
      <button class="profile" type="button" data-nav="Profile" aria-label="Open Elizabeth G.'s profile">
        <img src="assets/figma-main-nav-user.svg" alt="" />
        <span>Elizabeth G.</span>
      </button>
      <button class="mobile-menu" type="button" data-nav="Menu">Menu <span class="material-symbols-rounded" aria-hidden="true">menu</span></button>
    </header>

    <main id="app" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="dialog-root"></div>
    <script src="app.js"></script>
  </body>
</html>
